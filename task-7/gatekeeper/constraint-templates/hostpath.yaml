# Запрет использования hostPath volumes
apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8sforbiddenhostpath
  annotations:
    description: "Запрещает использование hostPath volumes для монтирования хост-ФС"
    owner: "security-team@propdevelopment.local"
spec:
  crd:
    spec:
      names:
        kind: K8sForbiddenHostPath
      validation:
        openAPIV3Schema:
          type: object
          properties:
            exemptNamespaces:
              type: array
              items:
                type: string
            allowedHostPaths:
              type: array
              items:
                type: string
              description: "Список разрешённых hostPath (если вообще разрешены)"
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8sforbiddenhostpath

        violation[{"msg": msg}] {
          volume := input.review.object.spec.volumes[_]
          volume.hostPath
          not is_exempt_namespace(input.review.object.metadata.namespace)
          not is_allowed_hostpath(volume.hostPath.path)
          msg := sprintf("Volume '%s' использует запрещённый hostPath: '%s'. Доступ к файловой системе хоста не разрешён.", [volume.name, volume.hostPath.path])
        }

        is_exempt_namespace(ns) {
          exempt := input.parameters.exemptNamespaces[_]
          exempt == ns
        }

        is_allowed_hostpath(path) {
          allowed := input.parameters.allowedHostPaths[_]
          startswith(path, allowed)
        }