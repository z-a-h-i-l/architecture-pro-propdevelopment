apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sForbiddenHostPath
metadata:
  name: forbid-hostpath-volumes
  labels:
    app: propdevelopment
    policy-type: security
spec:
  match:
    kinds:
      - apiGroups: [""]
        kinds: ["Pod"]
      - apiGroups: ["apps"]
        kinds: ["Deployment", "StatefulSet", "DaemonSet"]
    namespaces: ["audit-zone", "production", "staging"]
    excludedNamespaces:
      - kube-system
  parameters:
    exemptNamespaces: []
    # Если нужно разрешить конкретные пути (например, для CNI):
    # allowedHostPaths:
    #   - /var/run/secrets/kubernetes.io
    #   - /var/log/pods